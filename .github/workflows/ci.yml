name: Core CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 2026-kaib/housing-finance-core

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run lint
        run: python -m ruff check app tests

      - name: Run tests
        run: python -m pytest -q

  # PDF 보관 경로는 기본 test 잡에서 **건너뛴다** — WeasyPrint가 Pango/cairo 같은
  # 시스템 라이브러리를 요구해서 개발자 Windows 로컬에는 보통 없다. 건너뛴 검사는
  # 통과가 아니므로, 리눅스에서 실제로 굽는 잡을 따로 둔다.
  #
  # 특히 한글 두부(□□□)는 **PDF 생성이 성공한 채로** 나는 실패라 렌더링을 실제로
  # 해보지 않으면 잡히지 않는다. Dockerfile과 같은 폰트 패키지를 설치해 배포
  # 이미지와 같은 조건에서 확인한다.
  pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the rendering libraries and Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libcairo2 libgdk-pixbuf-2.0-0 fonts-noto-cjk

      # 글꼴 검사가 실패했을 때 "컨테이너에 폰트가 없다"와 "코드가 폰트를 못 본다"를
      # 로그만 보고 가를 수 있게 남긴다. 실제로 이 둘을 구분하지 못해 한 번 헤맸다.
      - name: List the Korean fonts fontconfig can see
        run: fc-list :lang=ko family || true

      - name: Install dependencies
        run: python -m pip install -e ".[dev,pdf]"

      - name: Fail if the rendering engine is unusable
        run: |
          python -c "
          from app.reports.pdf import pdf_rendering_available
          assert pdf_rendering_available(), 'WeasyPrint를 쓸 수 없습니다'
          "

      # 생애주기 그림은 인쇄 엔진이 SVG를 실제로 그려야 남는다. 무시하거나
      # 스타일을 못 받으면 PDF는 성공하고 그림만 비는데, 그건 한글 두부와 같은
      # 종류의 실패라 크기·형식 검사로는 잡히지 않는다. 여기서 실제로 굽는다.
      - name: Run the PDF archive tests
        run: |
          python -m pytest -q \
            tests/reports/test_pdf_archive.py \
            tests/reports/test_lifecycle_chart.py \
            tests/api/test_report_pdf_endpoints.py

  publish:
    if: >-
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs:
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: >-
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_HOME_DEPLOY == 'true'
    needs:
      - publish
    runs-on:
      - self-hosted
      - linux
      - housing-production
    environment:
      name: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out deployment definition
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the home-server environment
        run: |
          set -Eeuo pipefail
          test -f /opt/housing-finance/.env
          test -f /opt/housing-finance/backend.env
          docker version
          docker compose version
          docker network inspect housing-platform >/dev/null

      - name: Deploy and verify the backend
        env:
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -Eeuo pipefail

          previous_image="$(
            docker inspect \
              --format '{{.Config.Image}}' \
              housing-finance-api 2>/dev/null || true
          )"
          compose=(
            docker compose
            --project-name housing-finance
            --env-file /opt/housing-finance/.env
            -f deploy/compose.backend.yaml
          )

          export BACKEND_IMAGE
          "${compose[@]}" config --quiet
          "${compose[@]}" pull api

          if "${compose[@]}" up \
            -d \
            --no-deps \
            --wait \
            --wait-timeout 90 \
            api; then
            "${compose[@]}" ps api
            exit 0
          fi

          if [ -n "$previous_image" ] && [ "$previous_image" != "$BACKEND_IMAGE" ]; then
            echo "Deployment failed; restoring $previous_image"
            export BACKEND_IMAGE="$previous_image"
            "${compose[@]}" up \
              -d \
              --no-deps \
              --wait \
              --wait-timeout 90 \
              api
          fi

          exit 1
