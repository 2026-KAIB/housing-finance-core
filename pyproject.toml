[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "housing-finance-core"
version = "0.1.0"
description = "Housing purchase financial consulting API and calculation engines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]
# PDF 보관용. 기본 의존성에 넣지 않는 이유는 WeasyPrint가 Pango·cairo 같은
# **시스템 라이브러리**를 요구해서 Windows 로컬에서는 pip 설치만으로 동작하지
# 않기 때문이다. 없으면 PDF 경로만 막히고(`reports/pdf.py`) 계산·HTML 보고서는
# 그대로 돈다. 컨테이너(Dockerfile)에는 라이브러리와 함께 설치한다.
pdf = [
    "weasyprint>=62",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

